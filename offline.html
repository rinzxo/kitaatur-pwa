<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KitaAtur - Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8f5f5;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        color: #230f0f;
      }
      .card {
        width: min(92vw, 420px);
        background: #ffffff;
        border: 1px solid rgba(255, 74, 71, 0.2);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 16px 40px rgba(35, 15, 15, 0.12);
      }
      h1 {
        margin: 0;
        color: #ff4a47;
        font-size: 1.25rem;
      }
      p {
        margin: 12px 0 0;
        line-height: 1.5;
      }
      button {
        margin-top: 18px;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 12px;
        background: #ff4a47;
        color: #fff;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Kamu sedang offline</h1>
      <p>Data terakhir yang sudah pernah dibuka masih bisa diakses. Coba lagi setelah koneksi internet stabil.</p>
      <button onclick="window.location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
