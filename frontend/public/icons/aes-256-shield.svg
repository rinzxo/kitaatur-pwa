<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="120" height="130" fill="none">
  <defs>
    <linearGradient id="shieldBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0087FF" />
      <stop offset="50%" stop-color="#01C4FB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="shieldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0087FF" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Outer Shield -->
  <path d="M60 6C60 6 98 16 112 30C112 75 98 108 60 124C22 108 8 75 8 30C22 16 60 6 60 6Z" 
        fill="url(#shieldBgGrad)" stroke="url(#shieldBorderGrad)" stroke-width="2.5" filter="url(#shieldGlow)" stroke-linejoin="round" />

  <!-- Inner Shield Inset Border -->
  <path d="M60 14C60 14 92 23 103 34C103 72 91 100 60 114C29 100 17 72 17 34C28 23 60 14 60 14Z" 
        fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1.2" />

  <!-- Lock Icon -->
  <g transform="translate(60, 42)">
    <!-- Shackle -->
    <path d="M-8 -6v-9a8 8 0 0 1 16 0v9" fill="none" stroke="#A7F3D0" stroke-width="3.2" stroke-linecap="round" />
    <!-- Lock Body -->
    <rect x="-14" y="-6" width="28" height="22" rx="5" fill="url(#shieldAccent)" />
    <!-- Keyhole -->
    <circle cx="0" cy="3" r="2.2" fill="#064E3B" />
    <path d="M0 5.2v4.5" stroke="#064E3B" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Text: AES-256 -->
  <text x="60" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AES-256</text>

  <!-- Subtitle Text -->
  <text x="60" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="7.5" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="0.8">ENCRYPTED</text>
</svg>

