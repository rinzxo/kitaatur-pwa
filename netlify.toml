[build]
  # Mengarahkan Netlify untuk masuk ke folder frontend
  base = "frontend"
  # Perintah untuk mem-build aplikasi Next.js
  command = "npm run build"
  # Folder output hasil build Next.js
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/*"
  to = "https://apikitatur.rinzgroup.web.id/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"

